?spring.application.name=chaebee

# RDS MySQL 연결 설정
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:chaebee_dev_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:MySql1234!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 및 Hibernate 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

google.client-id=294165510110-t7gcc0ujh091j42raosltn8alkonrhr8.apps.googleusercontent.com

# JWT 설정
jwt.token.secret-key=${JWT_SECRET_KEY:chaebee-super-secret-jwt-key-min-32-bytes-long-required}
jwt.token.expiration.access=3600000
jwt.token.expiration.refresh=1209600000