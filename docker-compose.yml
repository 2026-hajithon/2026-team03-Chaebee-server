version: '3.8'

services:
  # 1. MySQL 데이터베이스 컨테이너
  db:
    image: mysql:8.0
    container_name: chaebee-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: MySql1234!
      MYSQL_DATABASE: chaebee_dev_db
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    restart: always

# 데이터 영구 저장을 위한 볼륨 설정
volumes:
  db_data: